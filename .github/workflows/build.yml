# 推送 v 开头的 tag（如 v0.2.0）时：在 Windows 上测试 → 打包 exe → 做安装包 → 发布到 Releases
# 也可以在 GitHub 网页的 Actions 页手动运行（产物在该次运行的 Artifacts 里）
name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖并测试
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
          python -m pytest -q

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean --windowed --name GongwenFormatter --paths src app.py

      - name: 计算版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "v=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: 制作安装包（Inno Setup）
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          # 中文安装向导语言包；下载失败也不影响打包，只是安装向导变成英文
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_3/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging\ChineseSimplified.isl
          } catch {
            Write-Warning "中文语言包下载失败，安装向导将使用英文：$_"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" packaging\installer.iss
          Compress-Archive -Path dist\GongwenFormatter\* -DestinationPath "dist\公文格式整理器-免安装版-${{ steps.ver.outputs.v }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gongwen-formatter-${{ steps.ver.outputs.v }}
          path: |
            dist/*.exe
            dist/*.zip

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
