[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gongwen-formatter"
version = "0.2.2"
description = "按输入的格式要求给 Word 公文自动排版"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rory Xiao" }]
dependencies = ["python-docx>=1.1", "lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gongwen-fmt = "gongwen_formatter.cli:main"

[project.gui-scripts]
gongwen-gui = "gongwen_formatter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
